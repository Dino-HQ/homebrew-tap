# Follows Dino-HQ/dino releases: regenerates the formula, proves it installs, commits it.
name: update

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to pin (default: the latest release)'
        required: false

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_ENV_HINTS: 1

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Regenerate the formula
        id: gen
        env:
          VERSION: ${{ inputs.version }}
        run: |
          scripts/update-formula.sh "${VERSION}"
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            version=$(sed -n 's|.*/releases/download/v\([^/]*\)/.*|\1|p' Formula/dino.rb | head -1)
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qam "dino ${version}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prove it installs
        if: steps.gen.outputs.changed == 'true'
        run: |
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
          brew tap dino-hq/tap "$GITHUB_WORKSPACE"
          brew audit --strict dino-hq/tap/dino
          brew install dino-hq/tap/dino
          brew test dino-hq/tap/dino

      - name: Push
        if: steps.gen.outputs.changed == 'true'
        run: git push origin HEAD:main
