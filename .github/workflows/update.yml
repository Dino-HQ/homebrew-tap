# Follows Dino-HQ/dino releases: regenerates the formula, proves it installs, commits it.
name: update

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to pin (default: the latest release)'
        required: false
  # Sent by the Dino release pipeline (Dino-HQ/project-dino release-sync.yml) as soon as a
  # release is complete, with client_payload.version. The schedule above stays as a safety net.
  repository_dispatch:
    types: [dino-released]

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_ENV_HINTS: 1

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Regenerate the formula
        id: gen
        env:
          VERSION: ${{ inputs.version || github.event.client_payload.version }}
          EVENT: ${{ github.event_name }}
        run: |
          # A dispatched version never moves the formula backwards (e.g. a recovery re-run of an
          # older release). A manual run with an explicit version can still pin any version.
          current=$(sed -n 's|.*/releases/download/v\([^/]*\)/.*|\1|p' Formula/dino.rb | head -1)
          if [ "${EVENT}" = "repository_dispatch" ] && [ -n "${current}" ] && \
             [ "$(printf '%s\n%s\n' "${current}" "${VERSION}" | sort -V | tail -1)" != "${VERSION}" ]; then
            echo "Formula is at ${current}; not moving it back to ${VERSION}."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          scripts/update-formula.sh "${VERSION}"
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            version=$(sed -n 's|.*/releases/download/v\([^/]*\)/.*|\1|p' Formula/dino.rb | head -1)
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qam "dino ${version}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prove it installs
        if: steps.gen.outputs.changed == 'true'
        run: |
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
          brew tap dino-hq/tap "$GITHUB_WORKSPACE"
          brew audit --strict dino-hq/tap/dino
          brew install dino-hq/tap/dino
          brew test dino-hq/tap/dino

      - name: Push
        if: steps.gen.outputs.changed == 'true'
        run: git push origin HEAD:main
